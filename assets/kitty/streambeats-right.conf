# streambeats preset — quick access terminal anchored to the RIGHT edge.
#
# Kitty panel integration for the streambeats player (odd/tasks/
# panel-terminal-choice.md, T6 / S6, issue #90). Spawned by the launcher:
#
#   scripts/streambeats-quick --terminal=kitty right
#
# Each re-run of the same command toggles the panel (single instance per
# instance-group), so binding this command to a KDE global shortcut gives
# the same show/hide key Ghostty's quick terminal provides. See docs/kitty.md.
#
# Size mapping from the Ghostty side table (docs/ghostty.md): the right
# strip is ~22% of the screen width. kitty has no percentage sizing for
# edge panels, so the strip uses pixels: ~22% of a 1920 screen. Adjust to
# taste; every value here is a regular quick-access-terminal.conf option.
#
# Reference: https://sw.kovidgoyal.net/kitty/kittens/quick-access-terminal/

edge right
columns 424px

# Mirror the Ghostty preset's autohide=false: the panel stays open when
# focus moves back to your editor, so playback keeps visible.
hide_on_focus_loss no

# Slight translucency like the Ghostty panel look; raise for opacity 1.0.
background_opacity 0.95

# Layer placement: overlay keeps the panel above your windows (IME users
# may prefer top; see the kitten docs).
layer overlay

# Wayland layer namespace — makes KDE window rules easy if you customize.
app_id streambeats-panel-kitty

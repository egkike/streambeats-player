# streambeats preset — anchored to the LEFT edge.
#
# Ghostty integration for the streambeats player (odd/tasks/streambeats.md,
# T7 / S3 + S7 + S8). See docs/ghostty.md for the full walkthrough.
#
# Use it with the launcher:
#   scripts/streambeats-quick left
# or directly (the `=` form matters, see below):
#   ghostty --config=assets/ghostty/streambeats-left.conf \
#           --config-default-files=false -e streambeats
#
# Ghostty 1.3.1 limitation: `--config <path>` (space form) is silently ignored,
# so the preset only loads with `--config=<path>`. This build also has no CLI
# action to spawn a quick terminal, so the script opens a normal dedicated
# window; the quick-terminal-* keys below are already active for the upgrade.
#
# Reference: https://ghostty.org/docs/config/reference

# --- Quick terminal geometry ------------------------------------------------
# Effective once your Ghostty has the `+toggle-quick-terminal` action (merged
# after 1.3.1, commit 4b7bf0b). On 1.3.1 these values are accepted and
# validated but there is no way to spawn the quick terminal from the CLI.

# Floating panel anchored to the left edge of the screen.
quick-terminal-position = left

# ~22% of the screen width: a narrow vertical strip; height stays maximized.
quick-terminal-size = 22%

# Keep the panel open when focus moves to another window, so playback and the
# TUI stay visible while working (Linux default, set explicitly for clarity).
quick-terminal-autohide = false

# Show/hide the panel. Ctrl+Alt+S is free in Ghostty's default keybind set.
# On 1.3.1 this toggles a quick terminal in *this* Ghostty instance, not the
# dedicated window the launcher opened.
keybind = ctrl+alt+s=toggle_quick_terminal

# --- Dedicated-window mode (what you get on Ghostty 1.3.1) -----------------
# Cancel any inherited maximize so the size hints actually apply.
maximize = false
# Ghostty 1.3 draws a native scrollbar sliver just outside the text grid;
# hide it so no detached thin line floats next to the panel.
scrollbar = never
# The user config's `window-padding-color = extend` paints padding with the
# edge cell color, which reads as a detached thin strip on narrow panels;
# force the plain background so the panel is clean edge-to-edge.
window-padding-color = background
# Zero the terminal padding: the default (8pt scaled on HiDPI) leaves a
# ~30px margin between the cell grid and the window edge, which visually
# separates the TUI surface from a thin detached strip.
# The user's background-opacity=0.95 blends the terminal surface with the
# wallpaper, but the padding band is painted solid dark, creating a visible
# seam at the panel edge; solid background makes the panel seamless.
background-opacity = 1.0
# The user's custom-shader recolors the cell grid (bg #151316 vs raw
# #06080f), leaving a visible seam at the panel edges; the shader loop only
# covers the grid, so disable it here for a seamless surface.
custom-shader =
window-padding-x = 0
window-padding-y = 0

# Pin the grapheme width method so ambiguous-width transport glyphs render
# EXACTLY the cells the hit-test models (issue #42 round-3): the legacy
# wcswidth semantics are what glyph hits assume; `unicode` in a user config
# may render the U+23ED family 2 cells wide and shift the transport row.
grapheme-width-method = legacy

# Window title, so the panel is identifiable in the task bar / window list.
# Stable class + title: KWin window rules and the .desktop
# StartupWMClass match these (see assets/kwin/window-rules.md).
class = streambeats-panel
title = streambeats player

# Narrow window hint (cells), matching the 22% side strip intent above.
window-width = 52
window-height = 24


# Optional system-wide shortcut. `global:` keybinds are not supported by every
# Linux build/compositor; uncomment only if your Ghostty accepts it.
# keybind = global:ctrl+alt+s=toggle_quick_terminal

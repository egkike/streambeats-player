<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>streambeats hub banner — synthwave panel</title>
<style>
  :root {
    /* Palette from internal/theme/theme.go (Synthwave artboard palette),
       drawn as the product itself: a mini TUI panel, art built from
       geometry only (SVG-safe, no glyph-dependent emoji). */
    --base: #14101c;
    --panel: #1a1425;
    --magenta: #ff5ec8;
    --violet: #8b7fd4;
    --spring: #6dff9c;
    --cyan: #4fd6e0;
    --text: #eae2f6;
    --dim: #7a72a8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0b0810; }
  body {
    font-family: ui-monospace, "JetBrains Mono", "Fira Code", Consolas, monospace;
    display: grid; place-items: center; min-height: 100vh; padding: 20px;
  }
  .banner {
    width: 1280px; height: 400px; border-radius: 12px;
    border: 1px solid #291f38;
    background:
      linear-gradient(122deg, #14101c 0%, #191126 58%, #1b1230 100%);
    position: relative; overflow: hidden;
    display: flex; align-items: center; gap: 0;
  }
  .banner::before { /* synthwave horizon glow */
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 420px 210px at 12% 100%, #ff5ec81f, transparent 70%),
      radial-gradient(ellipse 300px 160px at 92% -10%, #8b7fd422, transparent 70%);
    pointer-events: none;
  }
  /* ---- left: the panel itself, hand-drawn (all shapes, no text glyphs) ---- */
  .panel {
    flex: 0 0 640px; height: 300px; margin-left: 56px;
    background: #100c18; border: 1px solid #2c2140; border-radius: 10px;
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 18px 50px #00000088;
  }
  .panel-head {
    height: 40px; background: #170f22; border-bottom: 1px solid #2c2140;
    display: flex; align-items: center; gap: 8px; padding: 0 14px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; }
  .panel-title {
    margin-left: 10px; color: var(--magenta); font-size: 13px;
    font-weight: 700; letter-spacing: .08em;
  }
  .panel-rows { flex: 1; padding: 12px 14px; display: flex; flex-direction: column; gap: 9px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .row .idx { color: var(--dim); font-size: 12px; width: 14px; }
  .row .title { height: 10px; border-radius: 4px; background: #2c2140; }
  .row.sel .title { background: var(--magenta); }
  .row.play .title { background: #3a5a46; }
  .row .playmark { width: 24px; height: 10px; border-radius: 4px; }
  .row.play .playmark { background: var(--spring); }
  .row .t1 { width: 220px; } .row .t2 { width: 160px; } .row .t3 { width: 190px; }
  .panel-bottom {
    height: 34px; background: #170f22; border-top: 1px solid #2c2140;
    display: flex; align-items: center; padding: 0 14px; gap: 8px;
  }
  .cap {
    border: 1px solid #3a2c50; color: #cbbfe8; font-size: 11px;
    border-radius: 4px; padding: 2px 8px; background: #1c1430; white-space: nowrap;
  }
  .cap.key { color: var(--cyan); border-color: #2a5560; }
  .panel-side { /* the status slot: playing bar */
    position: absolute; right: 14px; bottom: 64px; left: auto; top: auto;
    width: 240px; height: 8px; border-radius: 4px; background: #2c2140; overflow: hidden;
  }
  .panel-side i {
    position: absolute; inset: 0 auto 0 0; width: 62%;
    background: var(--spring); border-radius: 4px;
  }
  /* ---- right: wordmark ---- */
  .wordmark-block { margin-left: 64px; color: var(--text); position: relative; }
  .wordmark { font-size: 84px; font-weight: 800; letter-spacing: -0.03em; margin: 0; }
  .wordmark .amp { color: var(--magenta); }
  .tagline { margin: 12px 0 0; color: #9d92c8; font-size: 20px; max-width: 46ch; }
  .tagline b { color: var(--cyan); font-weight: 700; }
  .meta { margin-top: 24px; display: flex; gap: 10px; flex-wrap: wrap; font-size: 13px; }
  .chip { color: #cbbfe8; border: 1px solid #3a2c50; border-radius: 999px; padding: 4px 12px; background: #191127; }
  .chip.warm { color: var(--magenta); border-color: #5c2c4c; }
</style>
</head>
<body>
  <main class="banner" role="img" aria-label="streambeats — the TUI panel as brand identity">
    <section class="panel" aria-hidden="true">
      <div class="panel-head">
        <span class="dot" style="background:#4a3c66"></span>
        <span class="dot" style="background:#4a3c66"></span>
        <span class="dot" style="background:var(--magenta)"></span>
        <span class="panel-title">~ STREAMBEATS</span>
      </div>
      <div class="panel-rows">
        <div class="row"><span class="idx">1</span><span class="title t1"></span></div>
        <div class="row play"><span class="idx">2</span><span class="title t2"></span><span class="playmark"></span></div>
        <div class="row sel"><span class="idx">3</span><span class="title t3"></span></div>
        <div class="row"><span class="idx">4</span><span class="title t2"></span></div>
        <div class="row"><span class="idx">5</span><span class="title t3"></span></div>
      </div>
      <div class="panel-side"><i></i></div>
      <div class="panel-bottom">
        <span class="cap">space</span><span class="cap key">z</span>
        <span class="cap">s</span><span class="cap key">v</span>
        <span class="cap">n</span><span class="cap key">sh</span>
      </div>
    </section>
    <div class="wordmark-block">
      <h1 class="wordmark">stream<span class="amp">beats</span></h1>
      <p class="tagline" style="margin-top:12px">a floating <b>terminal music player</b> for the free StreamBeats catalog</p>
      <div class="meta" aria-hidden="true">
        <span class="chip warm">ghostty quick panel</span>
        <span class="chip">go + bubbletea + mpv</span>
      </div>
    </div>
  </main>
</body>
</html>

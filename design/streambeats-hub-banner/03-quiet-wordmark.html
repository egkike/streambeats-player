<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>streambeats hub banner — quiet wordmark</title>
<style>
  :root {
    /* Palette from internal/theme/theme.go (Quiet artboard palette):
       near-monochrome ink, ONE blue accent — the most scannable direction. */
    --base: #12131a;
    --ink: #e6e9ef;
    --sub: #8b93a3;
    --blue: #7aa2f7;
    --green: #9ece6a;
    --surface: #1a1c26;
    --line: #262b3a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0a0b10; }
  body {
    font-family: ui-monospace, "JetBrains Mono", "Fira Code", Consolas, monospace;
    display: grid; place-items: center; min-height: 100vh; padding: 20px;
  }
  .banner {
    width: 1280px; height: 400px; border-radius: 12px;
    border: 1px solid var(--line); background:
      linear-gradient(180deg, #13141c 0%, var(--base) 70%), var(--base);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .banner::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse 500px 180px at 50% 118%, #7aa2f71c, transparent 70%);
    pointer-events: none;
  }
  .wordmark-row { display: flex; align-items: baseline; gap: 6px; }
  .wordmark {
    font-size: 104px; font-weight: 800; letter-spacing: -0.04em;
    color: var(--ink); margin: 0;
  }
  .wordmark .amp { color: var(--blue); }
  .wave { display: flex; align-items: flex-end; gap: 7px; margin-left: 26px; }
  .wave b {
    display: block; width: 9px; border-radius: 4px 4px 2px 2px; background: var(--blue);
  }
  .wave b:nth-child(1) { height: 26px; }
  .wave b:nth-child(2) { height: 58px; }
  .wave b:nth-child(3) { height: 40px; background: var(--green); }
  .wave b:nth-child(4) { height: 76px; }
  .wave b:nth-child(5) { height: 34px; background: var(--green); }
  .wave b:nth-child(6) { height: 62px; }
  .wave b:nth-child(7) { height: 22px; }
  .tagline {
    margin: 18px 0 0; color: var(--sub); font-size: 22px; text-align: center;
  }
  .tagline b { color: var(--ink); font-weight: 600; }
  .tagline .free { color: var(--green); font-weight: 700; }
  .meta {
    margin-top: 28px; display: flex; gap: 10px; font-size: 13px;
    color: var(--sub);
  }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; background: var(--surface); }
  .chip.acc { color: var(--blue); border-color: #2a3a5c; }
</style>
</head>
<body>
  <main class="banner" role="img" aria-label="streambeats — wordmark-first identity">
    <div class="wordmark-row">
      <h1 class="wordmark">stream<span class="amp">beats</span></h1>
      <div class="wave" aria-hidden="true"><b></b><b></b><b></b><b></b><b></b><b></b><b></b></div>
    </div>
    <p class="tagline" style="margin-bottom:0">a floating <b>terminal music player</b> for the <span class="free">free</span> StreamBeats catalog</p>
    <div class="meta" aria-hidden="true">
      <span class="chip">go + bubbletea + mpv</span>
      <span class="chip acc">ghostty quick panel</span>
      <span class="chip">MIT</span>
    </div>
  </main>
</body>
</html>

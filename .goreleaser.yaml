# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
#
# Release configuration — streambeats-player.
#
# Driven by .github/workflows/release.yml on every annotated `vX.Y.Z` tag.
# Pure Go (no C toolchain): a single build matrix covers all 5 targets.
#
# Local dry-run, no GITHUB_TOKEN and no network required:
#   goreleaser check
#   goreleaser release --snapshot --clean --skip=publish
#
# Instalable (scripts/install.sh): every release must carry the archive
# files listed below so a single checksum-verified download suffices.

version: 2

project_name: streambeats-player

builds:
  - id: streambeats
    main: ./cmd/streambeats
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    env:
      - CGO_ENABLED=0
    binary: 'streambeats{{ if eq .Os "windows" }}_{{ .Os }}_{{ .Arch }}{{ end }}'
    ldflags:
      - -s -w

archives:
  - formats: [tar.gz]
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]
    # Ship the full floating-panel experience: scripts/streambeats-quick +
    # assets/ghostty/streambeats-<side>.conf extract PRESERVING their relative
    # paths next to the script, while the binary itself is moved into bin/
    # by scripts/install.sh (scripts/streambeats-quick resolves its tree via
    # scripts/.. → the install prefix). See scripts/install.sh.
    files:
      - README.md
      - LICENSE
      - scripts/streambeats-quick
      - scripts/streambeats-panel
      # Shared scanner helper sourced by streambeats-panel for the kitty
      # relay (issue #122: its absence silently broke the toggle on
      # installed trees).
      - scripts/panel-terminal
      - assets/ghostty/streambeats-*.conf
      - assets/kitty/streambeats-*.conf
      # KDE integration assets (consumer of scripts/install.sh).
      - assets/desktop/streambeats-panel.desktop.in
      - assets/icons/streambeats-panel.svg
      - assets/kwin/window-rules.md

checksum:
  name_template: checksums.txt

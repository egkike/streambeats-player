# PR governance gate — issue-first workflow (owner-approved issues only).
#
# Enforcement of AGENTS.md "Git Governance": every pull request must
#   1. close or resolve at least one issue of THIS repository via a body
#      keyword (`Closes #N`, `Fixes #N`, `Resolves #N` — case-insensitive),
#   2. that issue must carry the `status:approved` label (owner approval),
#   3. carry EXACTLY ONE `type:*` label for the PR-type summary.
#
# The failing check is a review signal, not a hard merge lock: branch
# protection is owner-managed. Runners ship `gh` and `jq` preinstalled.

name: pr-gate

on:
  pull_request:
    types: [opened, edited, synchronize, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  issue-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate issue linkage, approval, and type label
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu

          fail() { echo "::error::$*" >&2; exit 1; }

          body="$(gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json body -q '.body // ""')"
          [ -n "$body" ] || fail "PR body is empty: link an approved issue with 'Closes #N'."

          # 1) at least one closing keyword with an issue number
          issues="$(printf '%s\n' "$body" \
            | grep -ioE '\b(closes|fixes|resolves)\b[^[:alnum:]]*#[0-9]+' \
            | grep -oE '#[0-9]+' | tr -d '#' | sort -u)" || true
          [ -n "$issues" ] || \
            fail "no issue linkage: the body must contain 'Closes #N' referencing an issue of this repository."

          # 2) every linked issue exists HERE and carries status:approved
          for n in $issues; do
            gh issue view "$n" --repo "$GITHUB_REPOSITORY" --json number,labels >/dev/null 2>&1 \
              || fail "Closes #$n: issue #$n does not exist in $GITHUB_REPOSITORY."
            gh issue view "$n" --repo "$GITHUB_REPOSITORY" --json labels \
              -q '.labels[].name' | grep -qx 'status:approved' \
              || fail "issue #$n is linked but lacks the owner-granted 'status:approved' label."
          done

          # 3) exactly one type:* label
          types="$(gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json labels -q '[.labels[].name | select(startswith("type:"))] | join("\n")')"
          count="$(printf '%s' "$types" | grep -c '^type:' || true)"
          [ "$count" -eq 1 ] || \
            fail "PR must carry EXACTLY ONE 'type:*' label (found $count: $(printf '%s' "$types" | tr '\n' ' '))"

          echo "pr-gate: OK — linked issues: $(printf '%s' "$issues" | tr '\n' ' '); labels ok."

# CI for code changes — streambeats-player
#
# Verifies Go code on every PR (and on direct pushes to main). The workflow
# itself runs on every push/PR so that a required status check is ALWAYS
# reported; path filtering happens at the JOB level via dorny/paths-filter.
# When no Go code changed, the "ci" job is skipped and GitHub treats a skipped
# required check as approved (an absent check would instead block the push).
# Docs-only changes therefore flow to main directly without friction.
#
# Pipeline mirrors AGENTS.md "Testing Standards":
#   go fmt -> go vet -> golangci-lint -> go build -> go test -race -> govulncheck

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Only PR runs are cancellable: the merge-commit run on main is release
  # evidence and must never be cancelled in flight.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect Go changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
      installer: ${{ steps.filter.outputs.installer }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            code:
              - '*.go'
              - 'go.mod'
              - 'go.sum'
              - 'internal/**'
              - 'cmd/**'
              - 'scripts/**'
              - '.golangci.yml'
              - '.github/workflows/ci.yml'
            installer:
              - 'scripts/**'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/ci.yml'

  ci:
    # Always-running required check: the ruleset (main-ci-gate) needs the
    # check instance on the very commit being pushed/merged, and a SKIPPED
    # check does not satisfy it. Every Go step is conditional on the code
    # filter, and docs-only pushes end in their own satisfying step.
    name: Verify Go code
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          check-latest: true

      - name: Print Go version
        if: needs.changes.outputs.code == 'true'
        run: go version

      - name: Format check
        if: needs.changes.outputs.code == 'true'
        run: |
          go fmt ./...
          test -z "$(git diff --name-only)" || { echo "go fmt modified files:"; git diff --name-only; exit 1; }

      - name: Vet
        if: needs.changes.outputs.code == 'true'
        run: go vet ./...

      - name: Lint
        if: needs.changes.outputs.code == 'true'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: ./...

      - name: Build
        if: needs.changes.outputs.code == 'true'
        run: go build -o /dev/null ./...

      # Issue #66: the Linux pipeline only builds for linux, so a darwin-only
      # compilation break would otherwise surface at release time. The
      # cross-builds cost seconds on this same runner and gate every Go PR;
      # the NATIVE macOS smoke stays scoped to installer-relevant changes
      # (its runner pool is small and starves under load).
      - name: Cross-build darwin amd64
        if: needs.changes.outputs.code == 'true'
        run: GOOS=darwin GOARCH=amd64 go build -o /dev/null ./...

      - name: Cross-build darwin arm64
        if: needs.changes.outputs.code == 'true'
        run: GOOS=darwin GOARCH=arm64 go build -o /dev/null ./...

      - name: Test (race enabled)
        if: needs.changes.outputs.code == 'true'
        run: go test -v -race -count=1 ./...

      - name: Dependency vulnerability scan
        if: needs.changes.outputs.code == 'true'
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: No Go changes — required check satisfied
        if: needs.changes.outputs.code != 'true'
        run: echo "docs-only change; Verify Go code satisfied without the Go pipeline"

  install-macos:
    name: Install macOS
    needs: changes
    # Issue #66: the native smoke verifies the installer story (install.sh,
    # deps, workflow) — narrowed from `code` so Go-only PRs skip the small,
    # starvation-prone macOS runner pool. Darwin COMPILATION stays gated on
    # every Go PR via the cross-builds above; a skipped instance here is
    # still reported as a satisfying required check (#16 doctrine).
    if: needs.changes.outputs.installer == 'true'
    # macos-14 runner images retired on 2026-11-02 (actions/runner-images#13518
    # scheduled brownout cancels the job at startup); macos-15 is the pinned
    # stable successor (issue #93).
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          check-latest: true

      # Real-binary e2e on native darwin: build cmd/streambeats, stage it
      # inside a checksummed fake release, run scripts/install.sh (this IS
      # the live bash 3.2 gate for the whole script), then run
      # `streambeats uninstall` end-to-end and the idempotent probe.
      - name: Install + uninstall smoke
        run: bash scripts/tests/macos_smoke_test.sh

      - name: Print macOS shell hygiene
        if: failure()
        run: |
          echo "bash: $(bash --version | head -1)"
          echo "uname: $(uname -srm)"
